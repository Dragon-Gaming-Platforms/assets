<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scramjet Proxy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a1a24;
      border-bottom: 1px solid #2e2e40;
      flex-shrink: 0;
    }
    #toolbar button {
      background: #2e2e40;
      border: none;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #toolbar button:hover { background: #3e3e58; }
    #go-btn { background: #5050b0 !important; }
    #go-btn:hover { background: #6060c0 !important; }
    #url-input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #2e2e40;
      background: #0f0f13;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      min-width: 0;
    }
    #url-input:focus { border-color: #6060c0; }

    #frame-container {
      flex: 1;
      position: relative;
    }
    #frame-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: #0f0f13;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #overlay h1 { font-size: 1.8rem; color: #8080e0; }

    #steps {
      list-style: none;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #steps li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #1a1a24;
      font-size: 13px;
      border: 1px solid #2e2e40;
    }
    #steps li .icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    #steps li.pending { color: #555; }
    #steps li.running { color: #aac; border-color: #5050a0; background: #15152a; }
    #steps li.done    { color: #7c7; border-color: #307030; background: #101a10; }
    #steps li.warn    { color: #fa8; border-color: #806020; background: #1e1508; white-space: pre-wrap; word-break: break-word; }
    #steps li.error   { color: #f88; border-color: #802020; background: #1e0808; white-space: pre-wrap; word-break: break-word; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #9090e0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="toolbar">
  <button id="back-btn">&#8592;</button>
  <button id="fwd-btn">&#8594;</button>
  <button id="reload-btn">&#8635;</button>
  <input id="url-input" type="text" placeholder="https://example.com" />
  <button id="go-btn">Go</button>
</div>

<div id="frame-container">
  <div id="overlay">
    <h1>🚀 Scramjet</h1>
    <ul id="steps">
      <li id="s-sw"        class="pending"><span class="icon">⬜</span><span>Register service worker (/sw.js)</span></li>
      <li id="s-ctrl"      class="pending"><span class="icon">⬜</span><span>Load ScramjetController</span></li>
      <li id="s-bm"        class="pending"><span class="icon">⬜</span><span>Load BareMux</span></li>
      <li id="s-init"      class="pending"><span class="icon">⬜</span><span>scramjet.init()</span></li>
      <li id="s-transport" class="pending"><span class="icon">⬜</span><span>Connect Epoxy/Wisp transport</span></li>
      <li id="s-frame"     class="pending"><span class="icon">⬜</span><span>Create proxied frame</span></li>
    </ul>
  </div>
</div>

<script>
"use strict";

// ── Absolute CDN URLs — no relative paths anywhere ────────────────────────────
const SJ  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2.0.0-alpha/dist/";
const BM  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2/dist/";
const EP  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2/dist/";

const SJ_CONTROLLER = SJ + "scramjet.controller.js";
const SJ_ALL        = SJ + "scramjet.all.js";
const SJ_SYNC       = SJ + "scramjet.sync.js";
const SJ_WASM       = SJ + "scramjet.wasm.wasm";
const BM_CLIENT     = BM + "bare-mux.js";
const BM_WORKER     = BM + "worker.js";
const EP_MODULE     = EP + "index.mjs";
const WISP          = "wss://wisp.mercurywork.shop/";

// sw.js MUST be a same-origin http/https URL — blob: is rejected by all browsers
const SW_URL = "/sw.js";

// ── Step UI ───────────────────────────────────────────────────────────────────
const STEP_IDS = ["s-sw","s-ctrl","s-bm","s-init","s-transport","s-frame"];

function stepRunning(id, msg) {
  const li = document.getElementById(id);
  li.className = "running";
  li.innerHTML = `<span class="spinner"></span><span>${msg}</span>`;
}
function stepDone(id, msg) {
  const li = document.getElementById(id);
  li.className = "done";
  li.innerHTML = `<span class="icon">✅</span><span>${msg}</span>`;
}
function stepWarn(id, msg) {
  const li = document.getElementById(id);
  li.className = "warn";
  li.innerHTML = `<span class="icon">⚠️</span><span>${msg}</span>`;
}
function stepError(id, msg) {
  const li = document.getElementById(id);
  li.className = "error";
  li.innerHTML = `<span class="icon">❌</span><span>${msg}</span>`;
  // Cancel all remaining steps
  const idx = STEP_IDS.indexOf(id);
  for (let i = idx + 1; i < STEP_IDS.length; i++) {
    const s = document.getElementById(STEP_IDS[i]);
    if (s.className === "pending") {
      s.className = "error";
      s.innerHTML = `<span class="icon">⏭</span><span>Skipped</span>`;
    }
  }
}

// ── Script loader ─────────────────────────────────────────────────────────────
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.crossOrigin = "anonymous";
    s.onload  = res;
    s.onerror = () => rej(new Error("Failed to fetch: " + src));
    document.head.appendChild(s);
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────
(async () => {

  if (!("serviceWorker" in navigator)) {
    stepError("s-sw", "Service Workers not supported in this browser/context.");
    return;
  }

  // ── 1. Register /sw.js (same-origin, plain https URL) ────────────────────
  stepRunning("s-sw", "Registering /sw.js…");
  try {
    // Unregister any stale SW first so changes take effect immediately
    for (const reg of await navigator.serviceWorker.getRegistrations()) {
      await reg.unregister();
    }
    await navigator.serviceWorker.register(SW_URL, { scope: "/" });
    await navigator.serviceWorker.ready;
    stepDone("s-sw", "Service worker active ✓");
  } catch (e) {
    stepError("s-sw",
      "SW registration failed: " + e.message + "\n\n" +
      "Make sure sw.js exists at the root of your GitHub Pages repo " +
      "(same directory as index.html)."
    );
    return;
  }

  // ── 2. Load ScramjetController ───────────────────────────────────────────
  stepRunning("s-ctrl", "Loading " + SJ_CONTROLLER + "…");
  try {
    await loadScript(SJ_CONTROLLER);
    if (typeof $scramjetLoadController !== "function")
      throw new Error("$scramjetLoadController not defined after script load");
    stepDone("s-ctrl", "scramjet.controller.js ✓");
  } catch (e) {
    stepError("s-ctrl", "Controller load failed: " + e.message);
    return;
  }

  // ── 3. Load BareMux client ───────────────────────────────────────────────
  stepRunning("s-bm", "Loading " + BM_CLIENT + "…");
  try {
    await loadScript(BM_CLIENT);
    if (typeof BareMux === "undefined")
      throw new Error("BareMux not defined after script load");
    stepDone("s-bm", "bare-mux.js ✓");
  } catch (e) {
    stepError("s-bm", "BareMux load failed: " + e.message);
    return;
  }

  // ── 4. ScramjetController.init() ─────────────────────────────────────────
  stepRunning("s-init", "Constructing ScramjetController and calling init()…");
  let scramjet;
  try {
    const { ScramjetController } = $scramjetLoadController();
    scramjet = new ScramjetController({
      prefix: "/scramjet/",
      codec: {
        encode: (url) => encodeURIComponent(url),
        decode: (url) => decodeURIComponent(url),
      },
      files: {
        wasm: SJ_WASM,
        all:  SJ_ALL,
        sync: SJ_SYNC,
      },
      flags: {
        captureErrors:  true,
        strictRewrites: false,
      },
    });
    await scramjet.init();
    stepDone("s-init", "ScramjetController ready ✓");
  } catch (e) {
    stepError("s-init", "scramjet.init() failed: " + e.message + "\n" + (e.stack ?? ""));
    return;
  }

  // ── 5. Set BareMux/Epoxy transport ───────────────────────────────────────
  stepRunning("s-transport", "Connecting Epoxy → " + WISP + "…");
  try {
    const conn = new BareMux.BareMuxConnection(BM_WORKER);
    await conn.setTransport(EP_MODULE, [{ wisp: WISP }]);
    stepDone("s-transport", "Epoxy/Wisp transport connected ✓");
  } catch (e) {
    stepWarn("s-transport", "Transport warning (non-fatal): " + e.message);
    console.warn("[sj] transport:", e);
  }

  // ── 6. Create proxied frame ──────────────────────────────────────────────
  stepRunning("s-frame", "Creating proxied iframe…");
  let frame;
  try {
    frame = scramjet.createFrame();
    const container = document.getElementById("frame-container");
    container.appendChild(frame.frame);
    Object.assign(frame.frame.style, {
      position: "absolute", inset: "0",
      width: "100%", height: "100%", border: "none",
    });
    stepDone("s-frame", "Frame ready ✓");
  } catch (e) {
    stepError("s-frame", "createFrame() failed: " + e.message);
    return;
  }

  // Hide overlay
  document.getElementById("overlay").style.display = "none";

  // ── Navigation ────────────────────────────────────────────────────────────
  const urlInput = document.getElementById("url-input");

  function navigate(raw) {
    let url = raw.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    urlInput.value = url;
    frame.navigate(url);
  }

  frame.frame.addEventListener("load", () => {
    try {
      if (frame.url?.href && frame.url.href !== "about:blank") {
        urlInput.value = frame.url.href;
      }
    } catch (_) {}
  });

  document.getElementById("go-btn").addEventListener("click",    () => navigate(urlInput.value));
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") navigate(urlInput.value); });
  document.getElementById("back-btn").addEventListener("click",   () => { try { frame.back();    } catch(_){} });
  document.getElementById("fwd-btn").addEventListener("click",    () => { try { frame.forward(); } catch(_){} });
  document.getElementById("reload-btn").addEventListener("click", () => { try { frame.reload();  } catch(_){} });

  navigate("https://example.com");
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
