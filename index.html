<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scramjet Proxy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a1a24;
      border-bottom: 1px solid #2e2e40;
      flex-shrink: 0;
    }
    #toolbar button {
      background: #2e2e40;
      border: none;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #toolbar button:hover { background: #3e3e58; }
    #go-btn { background: #5050b0 !important; }
    #go-btn:hover { background: #6060c0 !important; }
    #reset-sw-btn { background: #b05050 !important; font-size: 12px; padding: 5px 8px; }
    #reset-sw-btn:hover { background: #c06060 !important; }
    #url-input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #2e2e40;
      background: #0f0f13;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      min-width: 0;
    }
    #url-input:focus { border-color: #6060c0; }

    #debug-log {
      padding: 8px 12px;
      background: #13131b;
      border-bottom: 1px solid #2e2e40;
      font-size: 11px;
      font-family: monospace;
      color: #888;
      max-height: 120px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #debug-log div { margin: 2px 0; }
    #debug-log .error { color: #f88; }
    #debug-log .success { color: #7c7; }
    #debug-log .info { color: #8ac; }

    #frame-container {
      flex: 1;
      position: relative;
    }
    #frame-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: #0f0f13;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #overlay h1 { font-size: 1.8rem; color: #8080e0; }
    #version { font-size: 11px; color: #555; margin-top: -10px; }

    #steps {
      list-style: none;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #steps li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #1a1a24;
      font-size: 13px;
      border: 1px solid #2e2e40;
    }
    #steps li .icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    #steps li.pending { color: #555; }
    #steps li.running { color: #aac; border-color: #5050a0; background: #15152a; }
    #steps li.done    { color: #7c7; border-color: #307030; background: #101a10; }
    #steps li.warn    { color: #fa8; border-color: #806020; background: #1e1508; white-space: pre-wrap; word-break: break-word; }
    #steps li.error   { color: #f88; border-color: #802020; background: #1e0808; white-space: pre-wrap; word-break: break-word; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #9090e0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="toolbar">
  <button id="back-btn">&#8592;</button>
  <button id="fwd-btn">&#8594;</button>
  <button id="reload-btn">&#8635;</button>
  <input id="url-input" type="text" placeholder="https://example.com" />
  <button id="go-btn">Go</button>
  <button id="reset-sw-btn" title="Unregister service worker and reload">Reset SW</button>
</div>

<div id="debug-log">
  <div class="info">Debug log (version 2025-01-XX-03):</div>
</div>

<div id="frame-container">
  <div id="overlay">
    <h1>🚀 Scramjet</h1>
    <div id="version">Loading v2025-01-XX-03...</div>
    <ul id="steps">
      <li id="s-sw"        class="pending"><span class="icon">⬜</span><span>Register service worker</span></li>
      <li id="s-ctrl"      class="pending"><span class="icon">⬜</span><span>Load ScramjetController</span></li>
      <li id="s-bm"        class="pending"><span class="icon">⬜</span><span>Load BareMux</span></li>
      <li id="s-init"      class="pending"><span class="icon">⬜</span><span>scramjet.init()</span></li>
      <li id="s-transport" class="pending"><span class="icon">⬜</span><span>Connect Epoxy/Wisp transport</span></li>
      <li id="s-frame"     class="pending"><span class="icon">⬜</span><span>Create proxied frame</span></li>
    </ul>
  </div>
</div>

<script>
"use strict";

// ── Visible logging ───────────────────────────────────────────────────────────
const debugLog = document.getElementById("debug-log");
function log(msg, type = 'info') {
  const div = document.createElement('div');
  div.className = type;
  div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
  debugLog.appendChild(div);
  debugLog.scrollTop = debugLog.scrollHeight;
  console.log('[Page]', msg);
}

log('JavaScript started', 'success');

// ── Reset SW button ───────────────────────────────────────────────────────────
document.getElementById("reset-sw-btn").addEventListener("click", async () => {
  log('Reset SW button clicked', 'info');
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    log('Found ' + regs.length + ' SW registrations', 'info');
    for (const reg of regs) {
      await reg.unregister();
      log('Unregistered: ' + reg.scope, 'success');
    }
    alert('Service worker cleared. Reloading...');
    location.reload();
  } catch (e) {
    log('Reset SW error: ' + e.message, 'error');
    alert('Error: ' + e.message);
  }
});

// ── CDN URLs ──────────────────────────────────────────────────────────────────
const SJ  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2.0.0-alpha/dist/";
const BM  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2/dist/";
const EP  = "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2/dist/";

const SJ_CONTROLLER = SJ + "scramjet.controller.js";
const SJ_ALL        = SJ + "scramjet.all.js";
const SJ_SYNC       = SJ + "scramjet.sync.js";
const SJ_WASM       = SJ + "scramjet.wasm.wasm";
const BM_CLIENT     = BM + "bare-mux.js";
const BM_WORKER     = BM + "worker.js";
const EP_MODULE     = EP + "index.mjs";
const WISP          = "wss://wisp.mercurywork.shop/";

const SW_URL   = "/assets/sw.js";
const SW_SCOPE = "/assets/";

log('Constants loaded', 'success');

// ── Step UI ───────────────────────────────────────────────────────────────────
const STEP_IDS = ["s-sw","s-ctrl","s-bm","s-init","s-transport","s-frame"];

function stepRunning(id, msg) {
  const li = document.getElementById(id);
  li.className = "running";
  li.innerHTML = `<span class="spinner"></span><span>${msg}</span>`;
  log('STEP: ' + id + ' - ' + msg, 'info');
}
function stepDone(id, msg) {
  const li = document.getElementById(id);
  li.className = "done";
  li.innerHTML = `<span class="icon">✅</span><span>${msg}</span>`;
  log('DONE: ' + id + ' - ' + msg, 'success');
}
function stepWarn(id, msg) {
  const li = document.getElementById(id);
  li.className = "warn";
  li.innerHTML = `<span class="icon">⚠️</span><span>${msg}</span>`;
  log('WARN: ' + id + ' - ' + msg, 'info');
}
function stepError(id, msg) {
  const li = document.getElementById(id);
  li.className = "error";
  li.innerHTML = `<span class="icon">❌</span><span>${msg}</span>`;
  log('ERROR: ' + id + ' - ' + msg, 'error');
  const idx = STEP_IDS.indexOf(id);
  for (let i = idx + 1; i < STEP_IDS.length; i++) {
    const s = document.getElementById(STEP_IDS[i]);
    if (s.className === "pending") {
      s.className = "error";
      s.innerHTML = `<span class="icon">⏭</span><span>Skipped</span>`;
    }
  }
}

function loadScript(src) {
  log('Loading: ' + src, 'info');
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.crossOrigin = "anonymous";
    s.onload  = () => { log('Loaded: ' + src, 'success'); res(); };
    s.onerror = () => { 
      const err = new Error("Failed: " + src);
      log('FAILED: ' + src, 'error');
      rej(err);
    };
    document.head.appendChild(s);
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────
(async () => {

  log('Main function started', 'info');

  if (!("serviceWorker" in navigator)) {
    stepError("s-sw", "Service Workers not supported");
    return;
  }

  log('Service Worker API available', 'success');

  // ── 1. Register SW ───────────────────────────────────────────────────────
  stepRunning("s-sw", "Registering " + SW_URL + "…");
  try {
    log('Getting existing SW registrations...', 'info');
    const regs = await navigator.serviceWorker.getRegistrations();
    log('Found ' + regs.length + ' existing registrations', 'info');
    
    for (const reg of regs) {
      log('Unregistering: ' + reg.scope, 'info');
      await reg.unregister();
    }
    
    log('Registering new SW: ' + SW_URL, 'info');
    const reg = await navigator.serviceWorker.register(SW_URL, { 
      scope: SW_SCOPE, 
      updateViaCache: 'none' 
    });
    log('SW registered, waiting for ready...', 'info');
    await navigator.serviceWorker.ready;
    log('SW ready!', 'success');
    stepDone("s-sw", "Service worker active ✓");
  } catch (e) {
    log('SW registration error: ' + e.message, 'error');
    stepError("s-sw", "SW failed: " + e.message);
    return;
  }

  // ── 2. Load Controller ────────────────────────────────────────────────────
  stepRunning("s-ctrl", "Loading scramjet.controller.js…");
  try {
    await loadScript(SJ_CONTROLLER);
    if (typeof $scramjetLoadController !== "function") {
      throw new Error("$scramjetLoadController undefined");
    }
    log('Controller loaded, function available', 'success');
    stepDone("s-ctrl", "scramjet.controller.js ✓");
  } catch (e) {
    log('Controller error: ' + e.message, 'error');
    stepError("s-ctrl", "Controller failed: " + e.message);
    return;
  }

  // ── 3. Load BareMux ───────────────────────────────────────────────────────
  stepRunning("s-bm", "Loading bare-mux.js…");
  try {
    await loadScript(BM_CLIENT);
    if (typeof BareMux === "undefined") {
      throw new Error("BareMux undefined");
    }
    log('BareMux loaded', 'success');
    stepDone("s-bm", "bare-mux.js ✓");
  } catch (e) {
    log('BareMux error: ' + e.message, 'error');
    stepError("s-bm", "BareMux failed: " + e.message);
    return;
  }

  // ── 4. Init scramjet ──────────────────────────────────────────────────────
  stepRunning("s-init", "Constructing ScramjetController…");
  let scramjet;
  try {
    log('Calling $scramjetLoadController()...', 'info');
    const { ScramjetController } = $scramjetLoadController();
    log('Creating controller instance...', 'info');
    scramjet = new ScramjetController({
      prefix: "/assets/scramjet/",
      codec: {
        encode: (url) => encodeURIComponent(url),
        decode: (url) => decodeURIComponent(url),
      },
      files: {
        wasm: SJ_WASM,
        all:  SJ_ALL,
        sync: SJ_SYNC,
      },
      flags: {
        captureErrors:  true,
        strictRewrites: false,
      },
    });
    log('Calling scramjet.init()...', 'info');
    await scramjet.init();
    log('scramjet.init() complete!', 'success');
    stepDone("s-init", "ScramjetController ready ✓");
  } catch (e) {
    log('Init error: ' + e.message, 'error');
    log('Stack: ' + (e.stack || 'none'), 'error');
    stepError("s-init", "Init failed: " + e.message);
    return;
  }

  // ── 5. Transport ──────────────────────────────────────────────────────────
  stepRunning("s-transport", "Connecting transport…");
  try {
    log('Creating BareMuxConnection...', 'info');
    const conn = new BareMux.BareMuxConnection(BM_WORKER);
    log('Setting transport...', 'info');
    await conn.setTransport(EP_MODULE, [{ wisp: WISP }]);
    log('Transport connected!', 'success');
    stepDone("s-transport", "Epoxy/Wisp ✓");
  } catch (e) {
    log('Transport warning: ' + e.message, 'info');
    stepWarn("s-transport", "Transport warning (non-fatal): " + e.message);
  }

  // ── 6. Create frame ───────────────────────────────────────────────────────
  stepRunning("s-frame", "Creating proxied iframe…");
  let frame;
  try {
    log('Creating frame...', 'info');
    frame = scramjet.createFrame();
    const container = document.getElementById("frame-container");
    container.appendChild(frame.frame);
    Object.assign(frame.frame.style, {
      position: "absolute", inset: "0",
      width: "100%", height: "100%", border: "none",
    });
    log('Frame created and appended!', 'success');
    stepDone("s-frame", "Frame ready ✓");
  } catch (e) {
    log('Frame error: ' + e.message, 'error');
    stepError("s-frame", "Frame failed: " + e.message);
    return;
  }

  // Hide overlay
  document.getElementById("overlay").style.display = "none";
  log('Init complete - overlay hidden', 'success');

  // ── Navigation ────────────────────────────────────────────────────────────
  const urlInput = document.getElementById("url-input");

  function navigate(raw) {
    let url = raw.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    urlInput.value = url;
    log('Navigating to: ' + url, 'info');
    frame.navigate(url);
  }

  frame.frame.addEventListener("load", () => {
    try {
      if (frame.url?.href && frame.url.href !== "about:blank") {
        urlInput.value = frame.url.href;
        log('Frame loaded: ' + frame.url.href, 'success');
      }
    } catch (_) {}
  });

  document.getElementById("go-btn").addEventListener("click",    () => navigate(urlInput.value));
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") navigate(urlInput.value); });
  document.getElementById("back-btn").addEventListener("click",   () => { try { frame.back();    } catch(_){} });
  document.getElementById("fwd-btn").addEventListener("click",    () => { try { frame.forward(); } catch(_){} });
  document.getElementById("reload-btn").addEventListener("click", () => { try { frame.reload();  } catch(_){} });

  navigate("https://example.com");
  log('Auto-navigation started', 'info');
})();

log('Script end reached', 'info');
</script>
</body>
</html>
